# Resume training from an existing full checkpoint.
# Keep mode aligned with HQ-SVC: InfoNCE + FiLM + FACodec.

# env
model_name: v2.0.0
device: 'cuda'
gpu_ids: '0'
num_gpus: 1

# training settings
data_path: 'data/singing_filelist'
file_list_path: 'data/singing_filelist/singing_train_file_list.txt'
ckpt_dir: 'results'
hifigan_config_path: 'configs/hifigan_config.json'
resume_training: true
resume_ckpt: 'results/v2.0.0/facodec_film_mlp/latest.pth'
resume_log_dir: null
finetune_ckpt: null
save_full_checkpoint: true
sample_rate: 44100
batch_size: 64
hop_size: 512
wav_sec: 2
seed: 1234
epochs: 100000
max_steps: 500000
fast_data_load: false
steps_per_save: 50000
max_model_saves: 10
k_fold: 0
validation_ratio: 0.01

# optimizer settings
learning_rate: 0.00015
adam_b1: 0.9
adam_b2: 0.999

nsf: 1
demo_num: 0
vol_aug: False
pitch_aug: False
spk_aug: False
spk_replace_rate: 0.0
spa_aug: False
use_text: False
use_prompt_label: False
use_ssim_loss: False
use_mi_loss: False
use_style_loss: False
use_spk_id: True
use_tfm: True
use_ssa: False
mode: [film_mlp, infonce, pred_f0, no_style]

guidance_scale: null
drop_rate: 0.0
model_paths: null

# diffusion
k_step_max: 100
infer_speedup: 10
infer_method: 'dpm-solver'

# logging settings
num_log_audio: 5
